[package]
name = "devlog"
version = "0.1.0"
description = "DevLog – ein Tagebuch für Programmierer"
edition = "2021"

# Tauri 2 baut die App als Bibliothek, damit dieselbe Codebasis auch auf Android/iOS läuft.
[lib]
name = "devlog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
